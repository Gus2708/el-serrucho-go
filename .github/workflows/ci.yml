name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El typecheck va antes que los tests a proposito: Expo Router resuelve
      # rutas por convencion de archivos, asi que un import roto no falla en
      # jest, falla en runtime dentro de la app.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci
